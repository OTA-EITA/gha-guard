name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          # Always use the newest 24.x, not the runner's cached (possibly unpatched) Node.
          check-latest: true
          cache: npm
      # Install scripts of dependencies never run; none of them need one.
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - name: dist is up to date
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "::error::dist/ is stale; run npm run build and commit" && exit 1)
      - name: the packaged CLI runs through a bin symlink
        # Unpacks the tarball instead of npm install -g, and links the bin the way npm does.
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/bin"
          tar xzf gha-guard-*.tgz -C "$RUNNER_TEMP/pkg"
          chmod +x "$RUNNER_TEMP/pkg/package/dist/cli.js"
          ln -s "$RUNNER_TEMP/pkg/package/dist/cli.js" "$RUNNER_TEMP/bin/gha-guard"
          "$RUNNER_TEMP/bin/gha-guard" --version | grep -q '^gha-guard '
          "$RUNNER_TEMP/bin/gha-guard" --fail-on none test/fixtures/vulnerable | grep -q 'GHA001'
          rm gha-guard-*.tgz

  audit-self:
    # gha-guard audits this repository's own workflows with the committed action.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./
        id: guard
        with:
          fail-on: low
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: ${{ steps.guard.outputs.sarif-file }}
          category: gha-guard

  vulnerable-fixtures:
    # The action must detect the deliberately vulnerable fixtures.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./
        id: guard
        continue-on-error: true
        with:
          path: test/fixtures/vulnerable
      - name: findings were reported and the step failed
        env:
          OUTCOME: ${{ steps.guard.outcome }}
          FINDINGS: ${{ steps.guard.outputs.findings }}
        run: |
          test "$OUTCOME" = failure
          test "$FINDINGS" -gt 10

  lockfile-guard:
    # Checks package-lock.json for supply-chain risks with https://github.com/OTA-EITA/lockfile-guard,
    # including a 7-day cooldown on newly published versions.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: OTA-EITA/lockfile-guard@f5a04e3deeb3926a41ee2011b6bdc2e8f58a7c0d # v0.1.0
        id: guard
        with:
          fail-on: medium
          # Reviewed: esbuild only verifies its platform binary, fsevents builds a macOS addon.
          # CI installs with --ignore-scripts anyway.
          allow-scripts: esbuild,fsevents
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: ${{ steps.guard.outputs.sarif-file }}
          category: lockfile-guard
