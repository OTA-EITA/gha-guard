on:
  issue_comment:
    types: [created]
permissions: {}
jobs:
  team:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/bench')
    runs-on: ubuntu-latest
    steps:
      - uses: TheModdingInquisition/actions-team-membership@v1
        with:
          team: core
          organization: org
          token: ${{ secrets.MEMBERSHIP_TOKEN }}
          exit: true
      - uses: xt0rted/pull-request-comment-branch@v2
        id: branch
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.branch.outputs.head_owner }}/${{ steps.branch.outputs.head_repo }}
          ref: ${{ steps.branch.outputs.head_sha }}
      - run: pnpm install --frozen-lockfile
  anyone:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/bench')
    runs-on: ubuntu-latest
    steps:
      - uses: xt0rted/pull-request-comment-branch@v2
        id: branch
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.head_ref }}
      - run: pnpm install --frozen-lockfile
