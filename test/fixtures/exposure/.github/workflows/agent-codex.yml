on: issue_comment
permissions: {}
jobs:
  sandboxed:
    runs-on: ubuntu-latest
    steps:
      - uses: openai/codex-action@v1
        with:
          allow-users: "*"
          prompt: Answer the question in the comment
  full-access:
    runs-on: ubuntu-latest
    steps:
      - uses: openai/codex-action@v1
        with:
          allow-users: "*"
          sandbox: danger-full-access
